[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variantgrid_api"
version = "1.9.0"
description = "A Python API client for VariantGrid"
authors = [
    { name = "Dave Lawrence", email = "davmlaw@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
    "dataclasses-json",
]

[project.scripts]
vg_api = "variantgrid_api.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "responses"]

[project.urls]
"Homepage" = "https://github.com/SACGF/variantgrid_api"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["examples"]
